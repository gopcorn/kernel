name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod
          cache: false
      - name: Create a workspace
        run: |
          go work init
          go work use -r .
      - run: make vet
      - run: make test
      - run: make isolation

  released:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdk/go.mod
          cache: false
      - name: Test each module against released versions
        run: |
          for m in sdk kernel client adapters conformance; do
            (cd $m && go test -race ./...)
          done
